services:
  - type: web
    name: real-customer-frontend
    env: node
    buildCommand: npm install && npm run build
    startCommand: npm start
    plan: starter

  - type: web
    name: real-customer-backend
    env: node
    buildCommand: npm install && npm run build
    startCommand: npm start
    plan: starter
    envVars:
      - key: NODE_ENV
        value: production
      - key: CLIENT_URL
        value: https://real-customer-frontend.onrender.com